apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/
# Here noauth overlay is using the same image as stable-master
transformers:
- ../../images/stable-master
patchesStrategicMerge:
- noauth.yaml
namespace: gce-pd-csi-driver
# To change the dev image, add something like the following.
images:
- name: gke.gcr.io/gcp-compute-persistent-disk-csi-driver
  newName: gcr.io/msau-gke-dev/gcp-compute-persistent-disk-csi-driver
  newTag: test-repro_linux_amd64
